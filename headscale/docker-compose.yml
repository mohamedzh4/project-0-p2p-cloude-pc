# Self-hosted Headscale (phase 14 / 14c). No Tailscale SaaS account.
# Copy .env.example to .env in this directory, then:
#   docker compose up -d
# Compose interpolates required env and fails if HEADSCALE_SERVER_URL is missing,
# same pattern as matchmaker/postgres. Headscale itself reads config.yaml;
# keep server_url there equal to HEADSCALE_SERVER_URL.
#
# Create an API key after first boot (put it in matchmaker/.env, never in git):
#   docker compose exec headscale headscale users create dcl
#   docker compose exec headscale headscale users list
#   docker compose exec headscale headscale apikeys create
#
# Default-deny ACLs: ./acl.hujson mounted read-only. Recreate/restart this
# container after pulling so policy.path is not empty.
#
# Platform exit node is NOT this service. Guest-path overlay (required for
# guest `--exit-node=dcl-platform-exit` to resolve):
#   docker compose -f docker-compose.yml -f docker-compose.exit-node.yml up -d
# Plain `docker compose up` still starts Headscale only (macOS Docker Desktop
# cannot run the overlay). Host Agent join never advertises an exit node.
# See docs/runbooks/headscale.md.

services:
  headscale:
    image: docker.io/headscale/headscale:0.26.1
    restart: unless-stopped
    command: serve
    environment:
      HEADSCALE_SERVER_URL: ${HEADSCALE_SERVER_URL:?HEADSCALE_SERVER_URL is required}
    ports:
      - "127.0.0.1:${HEADSCALE_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - ./acl.hujson:/etc/headscale/acl.hujson:ro
      - headscale_data:/var/lib/headscale
      - headscale_run:/var/run/headscale

volumes:
  headscale_data:
  headscale_run:

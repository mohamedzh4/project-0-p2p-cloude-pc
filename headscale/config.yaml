# Local-lab Headscale config (image 0.26.1). Not a production ACL policy.
# server_url must match HEADSCALE_SERVER_URL in .env (compose fail-closed).
# policy.path is empty on purpose: default-deny / per-session tags are NOT
# automated (architecture §9 item 4). Do not treat this file as production ACLs.
# Embedded DERP is off (needs TLS). Clients use Tailscale's public DERP map.
# Exit nodes: see docs/runbooks/headscale.md — not configured here.

server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

log:
  format: text
  level: info

policy:
  mode: file
  # Empty: Headscale allows all nodes to talk. That is not default-deny.
  path: ""

dns:
  magic_dns: true
  # Must differ from the server_url hostname.
  base_domain: hosts.dcl.test
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
  split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

randomize_client_port: false

    - paragraph [ref=f7e70]: A second display path was detected (iGPU or more than one GPU), so this PC can keep a screen while a guest uses a dedicated GPU.
    - paragraph [ref=f7e71]: When Pro is offered, the dedicated GPU is exclusive for the session — not a concurrent slice like CPU or RAM. This PC cannot use that card while a guest is connected.
    - paragraph [ref=f7e72]: The agent locates or fetches the hypervisor and signed guest image for this OS after the probe, then maps your CPU/RAM sliders (and a dedicated GPU, when you opt in) into a launch document and a VFIO / DDA plan. It computes PCI addresses itself — you do not run lspci. It does not boot a guest or bind a live GPU from this window. Standard needs at least 2 vCPU, 4 GiB RAM, and 50 GiB spare disk.

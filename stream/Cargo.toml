# DCL Stream: our game-streaming protocol. Design: docs/streaming-protocol-design.md,
# analysis of Sunshine/Moonlight: docs/sunshine-moonlight-analysis.md.
[workspace]
resolver = "2"
members = ["proto", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dcl-stream-proto = { path = "proto" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
reed-solomon-simd = "3"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
bytes = "1"

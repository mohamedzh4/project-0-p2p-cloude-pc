[package]
name = "dcl-stream-proto"
description = "DCL Stream wire format, FEC, reassembly, auth and rate control (no OS code)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Async helpers shared by server and client: QUIC config, cert pinning,
# message framing on QUIC streams, the auth handshake.
net = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:tokio", "dep:tracing"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
reed-solomon-simd.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
rand.workspace = true
hex.workspace = true
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
